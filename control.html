<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保險視界 Bot 控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
    background: #0a0e1a;
    color: #d0e4fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #0f1a2e;
    border: 1px solid #1c3a6a;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
  }
  .logo { font-size: 13px; color: #3a7bd5; letter-spacing: 6px; margin-bottom: 8px; text-align: center; }
  h1 { font-size: 22px; font-weight: 500; color: #d0e4fa; margin-bottom: 32px; text-align: center; }
  .btn {
    display: block; width: 100%; padding: 14px;
    border-radius: 12px; border: none; font-size: 15px;
    font-weight: 500; cursor: pointer; margin-bottom: 10px;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: #2e6fd4; color: #fff; }
  .btn-secondary { background: #0d1e40; color: #4a8fe0; border: 1px solid #1c3a6a; }
  .btn-success { background: #0d2e1a; color: #5dcaa5; border: 1px solid #0f6e56; flex: 1; }
  .btn-danger { background: #2e0f0f; color: #f09595; border: 1px solid #a32d2d; }
  .status { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; line-height: 1.5; }
  .status.success { background: #0d2e1a; color: #5dcaa5; border: 1px solid #0f6e56; display: block; }
  .status.error { background: #2e0f0f; color: #f09595; border: 1px solid #a32d2d; display: block; }
  .status.loading { background: #0d1e40; color: #4a8fe0; border: 1px solid #1c3a6a; display: block; }
  .divider { border: none; border-top: 1px solid #1c3a6a; margin: 20px 0; }
  .label { font-size: 12px; color: #4a6fa0; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row input {
    flex: 1; padding: 12px 14px; border-radius: 10px;
    background: #0d1e40; border: 1px solid #1c3a6a;
    color: #d0e4fa; font-size: 14px;
  }
  .row input::placeholder { color: #4a6fa0; }
  .row .btn { margin-bottom: 0; width: auto; padding: 12px 18px; }
  .btns3 { display: flex; gap: 8px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">INSURANCE VISION</div>
  <h1>Bot 控制台</h1>

  <p class="label">發文管理</p>
  <button class="btn btn-primary" onclick="triggerDraft()">產生今日草稿</button>

  <hr class="divider">

  <p class="label">確認發文（填入草稿 job_id）</p>
  <div class="row">
    <input type="text" id="jobId" placeholder="job_id（例：81d220e1）"/>
  </div>
  <div class="btns3">
    <button class="btn btn-success" onclick="approve(1)">發第 1 篇</button>
    <button class="btn btn-success" onclick="approve(2)">發第 2 篇</button>
    <button class="btn btn-success" onclick="approve(3)">發第 3 篇</button>
  </div>
  <button class="btn btn-danger" onclick="skip()">跳過此次</button>

  <hr class="divider">

  <p class="label">確認回覆留言（填入 reply_job_id）</p>
  <div class="row">
    <input type="text" id="replyJobId" placeholder="reply_job_id（例：a6fc5dfd）"/>
  </div>
  <div class="btns3">
    <button class="btn btn-success" onclick="approveReply()">確認發出回覆</button>
    <button class="btn btn-danger" onclick="skipReply()">略過</button>
  </div>

  <hr class="divider">

  <p class="label">系統</p>
  <button class="btn btn-secondary" onclick="checkJobs()">查看待審核草稿</button>
  <button class="btn btn-secondary" onclick="healthCheck()">確認系統狀態</button>

  <div class="status" id="status"></div>
</div>

<script>
const BASE = 'https://threads-bot-production-93cc.up.railway.app';

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function getJobId() {
  const v = document.getElementById('jobId').value.trim();
  if (!v) { showStatus('請填入 job_id', 'error'); return null; }
  return v;
}

function getReplyJobId() {
  const v = document.getElementById('replyJobId').value.trim();
  if (!v) { showStatus('請填入 reply_job_id', 'error'); return null; }
  return v;
}

async function triggerDraft() {
  showStatus('正在產生草稿，請稍候...', 'loading');
  try {
    await fetch(BASE + '/admin/trigger-draft', { method: 'POST' });
    showStatus('草稿已觸發！請查看 Telegram 通知，並將 job_id 填入上方欄位', 'success');
  } catch(e) {
    showStatus('連線失敗：' + e.message, 'error');
  }
}

async function approve(choice) {
  const jobId = getJobId();
  if (!jobId) return;
  showStatus('發文中...', 'loading');
  try {
    const r = await fetch(`${BASE}/approve/${jobId}/${choice}`, { method: 'POST' });
    const d = await r.json();
    if (d.status === 'published') {
      showStatus('發文成功！post_id: ' + d.post_id, 'success');
    } else {
      showStatus('狀態：' + d.status, 'loading');
    }
  } catch(e) {
    showStatus('失敗：' + e.message, 'error');
  }
}

async function skip() {
  const jobId = getJobId();
  if (!jobId) return;
  try {
    await fetch(`${BASE}/approve/${jobId}/skip`, { method: 'POST' });
    showStatus('已跳過', 'loading');
  } catch(e) {
    showStatus('失敗：' + e.message, 'error');
  }
}

async function approveReply() {
  const replyJobId = getReplyJobId();
  if (!replyJobId) return;
  showStatus('發出回覆中...', 'loading');
  try {
    const r = await fetch(`${BASE}/approve-reply/${replyJobId}/send`, { method: 'POST' });
    const d = await r.json();
    if (d.status === 'replied') {
      showStatus('回覆已發出！', 'success');
    } else {
      showStatus('狀態：' + d.status, 'loading');
    }
  } catch(e) {
    showStatus('失敗：' + e.message, 'error');
  }
}

async function skipReply() {
  const replyJobId = getReplyJobId();
  if (!replyJobId) return;
  try {
    await fetch(`${BASE}/approve-reply/${replyJobId}/skip`, { method: 'POST' });
    showStatus('已略過此則留言', 'loading');
  } catch(e) {
    showStatus('失敗：' + e.message, 'error');
  }
}

async function checkJobs() {
  showStatus('查詢中...', 'loading');
  try {
    const r = await fetch(BASE + '/admin/pending-jobs');
    const d = await r.json();
    const keys = Object.keys(d);
    if (keys.length === 0) {
      showStatus('目前沒有草稿記錄', 'loading');
    } else {
      const msgs = keys.map(k => `${k}: ${d[k].status}`).join('\n');
      showStatus(msgs, 'success');
    }
  } catch(e) {
    showStatus('連線失敗：' + e.message, 'error');
  }
}

async function healthCheck() {
  showStatus('檢查中...', 'loading');
  try {
    await fetch(BASE + '/health');
    showStatus('系統正常運行中', 'success');
  } catch(e) {
    showStatus('系統無回應：' + e.message, 'error');
  }
}
</script>
</body>
</html>
